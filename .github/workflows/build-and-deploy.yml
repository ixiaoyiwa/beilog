name: build-and-deploy

# ===== 使用说明 =====
# 部署目标 = 仓库变量 DEPLOY_TARGET（留空等于 pages）：
#   pages : 只部署到 Cloudflare Pages（默认）
#   r2    : 只上传到 R2（Pages 超过 2 万文件后使用）
#   both  : 两边都部署（演练用，让 R2 一直保持最新）
# 第一次：不用设任何变量，直接 Run workflow。
# 以后切到 r2：先完成手册步骤 9（规则 + both 演练），
#   再把变量改成 r2，运行后按手册步骤 10 切域名。
# 切换时不需要改这个文件。R2 需要额外的 Cloudflare 重写规则，Pages 不需要。
#
# ===== 防死循环设计 =====
# 1. 构建失败或超时后，「保存缓存」步骤仍会执行（if: !cancelled()）。
# 2. 缓存 key 每次不同（run_id），恢复时取最近一份（restore-keys）。
# 3. 缓存名里带缓存相关代码的哈希：上游代码一变，自动换分区。
# 4. 失败后自动续跑，总共最多 3 次尝试。
# 5. 想强制从零重来：Run workflow 时勾选 fresh_cache。

on:
  push:
    branches: [hexopodcast]
  workflow_dispatch:
    inputs:
      fresh_cache:
        description: 忽略旧缓存，从零重新抓取
        type: boolean
        default: false
      attempt:
        description: 自动续跑计数（手动运行请保持 1）
        type: string
        default: '1'

permissions:
  actions: write
  contents: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  TARGET: ${{ vars.DEPLOY_TARGET || 'pages' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: 检查部署目标
        run: |
          case "$TARGET" in
            pages|r2|both) echo "部署目标: $TARGET" ;;
            *) echo "::error::DEPLOY_TARGET 只能是 pages、r2、both 或留空，当前是: $TARGET"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: 写入构建环境变量
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          printf '%s\n' "$BUILD_ENV" > .env.production
          echo "已写入变量行数: $(grep -c '=' .env.production)"

      - name: 计算缓存分区
        id: part
        run: echo "prefix=notion-data-${{ hashFiles('lib/cache/**', 'lib/db/SiteDataApi.js', 'lib/db/notion/getPostBlocks.js') }}-" >> "$GITHUB_OUTPUT"

      - name: 恢复 Notion 缓存
        id: restore
        if: ${{ !inputs.fresh_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .next/cache/notion/data
          key: ${{ steps.part.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.part.outputs.prefix }}

      - name: 缓存状态（构建前）
        run: |
          echo "缓存分区: ${{ steps.part.outputs.prefix }}"
          echo "命中的缓存: '${{ steps.restore.outputs.cache-matched-key }}'"
          echo "缓存文件数: $(ls .next/cache/notion/data 2>/dev/null | wc -l)"

      - name: 构建
        id: build
        timeout-minutes: 330
        run: yarn export 2>&1 | tee build.log

      - name: 缓存状态（构建后）
        if: ${{ !cancelled() }}
        run: |
          echo "缓存文件数: $(ls .next/cache/notion/data 2>/dev/null | wc -l)"
          du -sh .next/cache/notion 2>/dev/null || true

      - name: 保存 Notion 缓存（失败也保存）
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .next/cache/notion/data
          key: ${{ steps.part.outputs.prefix }}${{ github.run_id }}

      - name: 检查产物
        run: |
          test -f out/index.html || { echo "::error::out/index.html 不存在"; exit 1; }
          n=$(find out -type f | wc -l)
          size=$(du -sh out | cut -f1)
          echo "out 文件数: $n，体积: $size"
          {
            echo "### 构建结果"
            echo "- 部署目标: $TARGET"
            echo "- out 文件数: $n（Pages 上限 20000）"
            echo "- out 体积: $size"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt 2000 ]; then
            echo "::error::文件数异常偏少，拒绝部署，避免清空线上站点"; exit 1
          fi
          if [ "$n" -ge 16000 ]; then
            echo "::warning::文件数 $n 已逼近 Pages 上限 20000。切到 R2 的做法：先完成手册步骤 9（演练），再把变量 DEPLOY_TARGET 改成 r2，并按步骤 10 切域名"
          fi
          if [ "$TARGET" != "r2" ]; then
            if [ "$n" -ge 20000 ]; then
              echo "::error::文件数超过 Pages 上限 20000。请先完成手册步骤 9，再把 DEPLOY_TARGET 改成 r2"; exit 1
            fi
            big=$(find out -type f -size +25M | wc -l)
            if [ "$big" -gt 0 ]; then
              echo "::error::有 $big 个文件超过 25 MiB，Pages 不接受"; exit 1
            fi
          fi
          f=$(grep -c '\[请求失败\]' build.log || true)
          echo "Notion 抓取失败次数: $f"
          if [ "$f" -gt 0 ]; then
            echo "::error::有文章抓取失败，拒绝部署。会自动续跑（缓存接着用）"; exit 1
          fi

      # ---------- 链路 A：Cloudflare Pages ----------
      - name: 部署到 Cloudflare Pages
        if: ${{ env.TARGET == 'pages' || env.TARGET == 'both' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.PAGES_PROJECT }} --branch=main --commit-dirty=true

      # ---------- 链路 B：Cloudflare R2 ----------
      - name: 安装 rclone
        if: ${{ env.TARGET == 'r2' || env.TARGET == 'both' }}
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: 上传到 R2
        if: ${{ env.TARGET == 'r2' || env.TARGET == 'both' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          rclone copy out/_next/static "R2:$BUCKET/_next/static" \
            --checksum --transfers 32 --checkers 32 \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --stats-one-line -v
          rclone sync out "R2:$BUCKET" \
            --exclude "/_next/static/**" \
            --checksum --transfers 32 --checkers 32 \
            --header-upload "Cache-Control: public, max-age=0, must-revalidate" \
            --stats-one-line -v

      # ---------- 失败时自动续跑 ----------
      - name: 失败时自动续跑（总共最多 3 次尝试）
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -lt 3 ]; then
            next=$((ATTEMPT + 1))
            echo "第 $ATTEMPT 次尝试失败，自动发起第 $next 次（缓存会接着用）"
            gh workflow run build-and-deploy.yml --ref "${{ github.ref_name }}" -f attempt="$next"
          else
            echo "::error::已连续尝试 $ATTEMPT 次仍失败，不再自动重试，请查看日志"
          fi
